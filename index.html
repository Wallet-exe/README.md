
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>E-Wallet – Installer App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont,

      text-align: center;
      border-radius: 25px;
      box-shadow: 0 12px 40px #00000012;
    }

    .icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      color: #777;
      line-height: 1.5;
    }

    .button {
      display: block;
      padding: 18px;
      margin-top: 30px;
      background: #007aff;
      color: white;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .button:active {
      background: #005ecb;
    }

    .small {
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="icon">💳</div>

    <h1>E-Wallet</h1>

    <a class="button" href="./AppleJr_AntiRevoke_Single.mobileconfig">DNS</a>
