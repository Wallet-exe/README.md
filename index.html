
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Wallet - Installer app</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: #1d1d1f;
    }

    .card {
      width: 90%;
      max-width: 390px;
      background: white;
      padding: 40px 25px;
      text-align: center;
      border-radius: 24px;
      box-shadow: 0 12px 40px #00000012;
    }

    .icon { font-size: 65px; }

    h1 { font-size: 30px; margin-bottom: 10px; }

    p { color: #777; }

    .button {
      display: block;
      padding: 17px;
      margin-top: 25px;
      background: #007aff;
      color: white;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }

    .small { font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💳</div>
    <h1>Wallet</h1>
    <p>Installer Wallet på din iPhone</p>

    <a class="button"
       href="itms-services://?action=download-manifest&amp;url=https://wallet-exe.github.io/README.md/manifest.plist">
       Installer Wallet
    </a>

    <p class="small">
      Åbn denne side i Safari på din iPhone.
    </p>
  </div>
</body>
</html>
